# load balancer address
load balancer: http://127.0.0.1:8000

# max simultaneous downstream TCP connections across all listener addresses
# excess connections are closed; default is 1024
max client connections: 1024

# disable Nagle's algorithm on backend TCP connections
# default: false
backend tcp nodelay: false

# load balancer algorithm to use
# round_robin, weighted_round_robin, least_connections
# weighted_least_connections, least_response_time, weighted_least_response_time
algorithm: round_robin

# backend server addresses (http:// or https://; HTTPS uses system-trusted certificates)
servers: http://127.0.0.1:3001, http://127.0.0.1:3002, http://127.0.0.1:3003

# backend server weights per server defined
# (optional depending on the algorithm being used)
weights: 20, 30, 10

# max connections per server defined
max connections: 1000, 1000, 1000

# max server response time (in s)
timeout: 10

# max idle time while receiving a client request body (in s)
client upload timeout: 60

# request timeout overrides in server-list order
# use 'default' for global timeout
server timeouts: default, default, default

# max time allowed for a health check (in s)
health check timeout: 10

# health-check paths and timeout overrides in server-list order
# paths are joined to each backend's configured base path
# use 'default' to inherit the global health check timeout
health check paths: /, /, /
health check timeouts: default, default, default

#  interval (in s) for checking the health of the server
health check interval: 10

# consecutive probe results required to change backend health
health check healthy threshold: 1
health check unhealthy threshold: 2
